ate. The survey should take you no more than 30 minutes to complete.<br><br><b>Purpose of the Study<\/b>: This study aims to better understand the stressors, barriers, and experiences of students at the University of Ottawa with the goal of contributing to a more equitable and inclusive learning environment. It will also assess perceptions of support systems and university initiatives, including but not limited to those related to anti-racism and student well-being in order to address gaps and limitations.<br><br><b>Benefits<\/b>: Although you may not directly benefit from this study, we hope your participation will contribute to a more inclusive and equitable university for all students.<br><br><b>Risks<\/b>: Some questions are sensitive in nature and may cause discomfort. For example, this survey asks questions about race, ethnicity, mental health, discrimination, trauma, and personal identity. You may feel some distress in recounting past experiences of discrimination. A list of mental health support services is provided at the end of this form if you need emotional support as a result of participating in any part of this study. You are free to discontinue the study at any time if you feel distress. We believe there are no other risks associated with this research study; however, a possible inconvenience may be the time it takes to complete the study.\n<div style=\"text-align: left;\"><br>\n<strong>Confidentiality and Anonymity:<\/strong> All information obtained during the course of this study is confidential and your identity will be protected at all times. We will not disclose information to anyone about who participated in this study. You will not be identifiable in any publications or presentations resulting from this study. All study material will be labelled with a Study ID generated by the researchers and moved to the PI's secure computer rather than being stored on the internet to reduce the risk of any unauthorized access.<br>\n<br>\nThe only instance where confidentiality has to be broken is if you tell us about any identifiable person who requires protection, in which case we may need to break confidentiality to keep the person safe. This includes if you are at imminent risk of harming yourself or someone else, if a young person is being harmed in any way, or if an elderly person in a residential care home is being abused.<br>\n<br>\nThe only people who will have access to the research data are the researchers conducting this study at the University of Ottawa. Results of the study will be published in pooled (aggregate) format only. Your answers to open-ended questions may be used verbatim in presentations and publications but you will not be identified. Pseudonyms will be used and all potentially identifying information, such as the names of family members, communities, schools, names of agencies, names of consulting professionals will also be changed or redacted so as to maintain the confidentiality of the participants.<br>\n<br>\nIn order to minimize the risk of security breaches and to help ensure your confidentiality we recommend that you use standard safety measures such as signing out of your account, closing your browser and locking your screen or device when you are no longer using them / when you have completed the study.<br>\n<br>\n<strong>Conservation of Data: <\/strong>The following procedures will be used to protect the confidentiality of your data. The questionnaires will be labelled with a Study ID generated by the researchers, not with your name. All data will be kept on a secure encrypted password-protected computer or hard drive in a locked office at the University of Ottawa. All other identifying data will be destroyed one year after the completion of the study. Anyone who wishes to withdraw their data from the study after they complete it but before 1 year may do so by contacting <span class=\"redacted\" style=\"background:#111;color:#fff;border-radius:2px;padding:0 .4em;font:600 .82em ui-monospace,Menlo,monospace;letter-spacing:.02em;white-space:nowrap\">REDACTED: principal investigator<\/span>. After this one-year period, it will not be possible to remove anyone’s data, as all identifying information will have been destroyed. Unidentified data may be kept indefinitely for academic purposes.<br>\n<br>\n<strong>Compensation: <\/strong>As a thank-you for your participation, you will be entered into a raffle to win one of fifty $50 Amazon gift cards. Students enrolled through the ISPR system in the Department of Psychology may instead receive 1 ISPR point for participation. If you withdraw from the study before completion due to an adverse experience, you can still be entered in the raffle by contacting <span class=\"redacted\" style=\"background:#111;color:#fff;border-radius:2px;padding:0 .4em;font:600 .82em ui-monospace,Menlo,monospace;letter-spacing:.02em;white-space:nowrap\">REDACTED: principal investigator<\/span> directly.<br>\n<br>\n<strong>Voluntary Participation:<\/strong> You are under no obligation to participate. If you choose to participate, you may withdraw from the study at any time without suffering any negative consequences. Your participation or non-participation in this study will not influence any services or programs you are accessing or wish to access in the future.<br>\n<br>\n<strong>Information about the Study Results:<\/strong> After the study is completed, research findings will be available to any participants who are interested in the results. These results, reported in summary form only, will be available from <span class=\"redacted\" style=\"background:#111;color:#fff;border-radius:2px;padding:0 .4em;font:600 .82em ui-monospace,Menlo,monospace;letter-spacing:.02em;white-space:nowrap\">REDACTED: principal investigator<\/span>, who can be contacted at the address listed below.<\/div><div style=\"text-align: left;\"><br><\/div><div style=\"text-align: left;\">If you have any questions or require more information about the study were you born? Outside of Canada (Please specify what country): Is Selected"}, {"question_id": "QID167", "trigger_question_id": "QID166", "trigger_choice_id": "1", "operator": "Selected", "description": "If Would it be alright for us to contact you if we have questions about any of your responses? Yes Is Selected"}, {"question_id": "QID204", "trigger_question_id": "QID168", "trigger_choice_id": "1", "operator": "Selected", "description": "If Would you be interested in participating in one of our focus groups, designed to be a safe space... Yes Is Selected"}], "images": [], "embedded_data": [], "branches": [], "block_randomizers": [{"blocks_shown": 7, "has_even_presentation": true, "block_ids": ["BL_0ALuEzjEVffZLGS", "BL_eWkLsTUxU5HSolM", "BL_50xcye54WUPI0m2", "BL_1G1dQO1SV93kyX4", "BL_dlZTNshxygDj6eO", "BL_3wv4NYz0bhIHQzQ", "BL_enCH8RPCVWWO1uK"]}], "options": {"has_back_button": true, "has_save_and_continue": true, "languages": ["EN", "FR-CA"]}}</script>
<script>
(function () {
  "use strict";
  const survey = JSON.parse(document.getElementById("survey-data").textContent);
  document.getElementById("title").textContent = "uOttawa Campus Climate Survey for BIPOC";

  // Block order: the randomizer shows its blocks in a random order where they sit in the flow.
  const blocks = survey.blocks.slice();
  for (const randomizer of survey.block_randomizers) {
    const positions = [];
    blocks.forEach((block, index) => { if (randomizer.block_ids.includes(block.block_id)) positions.push(index); });
    const shuffled = positions.map((index) => blocks[index]);
    for (let i = shuffled.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
    positions.forEach((index, k) => { blocks[index] = shuffled[k]; });
  }
  const pages = [];
  blocks.forEach((block) => block.pages.forEach((page, pageIndex) => pages.push({ block: block.name, pageIndex, questions: page.questions })));

  const answers = {};          // question_id -> value
  const displayRules = survey.display_rules;
  const skipRules = survey.skip_rules;
  let current = 0;
  const history = [];

  const jump = document.getElementById("jump");
  pages.forEach((page, index) => {
    const option = document.createElement("option");
    option.value = index;
    option.textContent = (index + 1) + ". " + page.block + (page.pageIndex ? " (" + (page.pageIndex + 1) + ")" : "");
    jump.appendChild(option);
  });
  jump.addEventListener("change", () => { history.push(current); show(Number(jump.value)); });

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (key === "html") node.innerHTML = value; else if (key === "text") node.textContent = value; else node.setAttribute(key, value);
    }
    (children || []).forEach((child) => node.appendChild(child));
    return node;
  }

  function isVisible(question) {
    const rules = displayRules.filter((rule) => rule.question_id === question.question_id);
    return rules.every((rule) => {
      const value = answers[rule.trigger_question_id];
      const selected = value && (value.choice === rule.trigger_choice_id || (Array.isArray(value.choices) && value.choices.includes(rule.trigger_choice_id)));
      return rule.operator === "Selected" ? !!selected : !selected;
    });
  }

  function choiceInput(question, choice, type, name) {
    const id = question.question_id + "_" + choice.choice_id;
    const input = el("input", { type, name, id, value: choice.choice_id });
    const value = answers[question.question_id] || {};
    if (type === "radio" && value.choice === choice.choice_id) input.checked = true;
    if (type === "checkbox" && (value.choices || []).includes(choice.choice_id)) input.checked = true;
    const label = el("label", { for: id, html: choice.text.html });
    const row = el("div", { class: "opt" }, [input, label]);
    if (choice.has_text_entry) {
      const text = el("input", { type: "text", "aria-label": choice.text.plain });
      text.value = (value.text || {})[choice.choice_id] || "";
      text.addEventListener("input", () => {
        const current = answers[question.question_id] || {};
        current.text = Object.assign({}, current.text, { [choice.choice_id]: text.value });
        answers[question.question_id] = current;
      });
      row.appendChild(text);
    }
    input.addEventListener("change", () => {
      const current = answers[question.question_id] || {};
      if (type === "radio") current.choice = choice.choice_id;
      else {
        const set = new Set(current.choices || []);
        input.checked ? set.add(choice.choice_id) : set.delete(choice.choice_id);
        current.choices = [...set];
      }
      answers[question.question_id] = current;
      refreshVisibility();
    });
    return row;
  }

  function matrix(question, columns, rows, multiple) {
    const head = el("tr", {}, [el("th", { class: "row" })].concat(columns.map((point) => el("th", { html: point.text.html }))));
    const body = rows.map((row) => {
      const value = (answers[question.question_id] || {})[row.choice_id];
      const cells = columns.map((point) => {
        const input = el("input", { type: multiple ? "checkbox" : "radio", name: question.question_id + "_" + row.choice_id, value: point.answer_id, "aria-label": row.text.plain + ": " + point.text.plain });
        if (multiple ? (value || []).includes(point.answer_id) : value === point.answer_id) input.checked = true;
        input.addEventListener("change", () => {
          const current = answers[question.question_id] || {};
          if (multiple) {
            const set = new Set(current[row.choice_id] || []);
            input.checked ? set.add(point.answer_id) : set.delete(point.answer_id);
            current[row.choice_id] = [...set];
          } else current[row.choice_id] = point.answer_id;
          answers[question.question_id] = current;
        });
        return el("td", {}, [input]);
      });
      return el("tr", {}, [el("td", { class: "row", html: row.text.html })].concat(cells));
    });
    return el("div", { class: "grid-wrap" }, [el("table", { class: "grid" }, [el("thead", {}, [head]), el("tbody", {}, body)])]);
  }

  function sideBySide(question) {
    const columns = question.side_by_side_columns;
    const top = el("tr", {}, [el("th", { class: "row" })].concat(columns.map((column) => el("th", { class: "sbs-col", colspan: column.scale_points.length, html: column.text.html }))));
    const second = el("tr", {}, [el("th", { class: "row" })].concat(columns.flatMap((column) => column.scale_points.map((point) => el("th", { html: point.text.html })))));
    const body = question.choices.map((row) => {
      const cells = columns.flatMap((column) => column.scale_points.map((point) => {
        const key = column.column_id + "|" + row.choice_id;
        const input = el("input", { type: "radio", name: question.question_id + "_" + key, value: point.answer_id, "aria-label": row.text.plain + ", " + column.text.plain + ": " + point.text.plain });
        if (((answers[question.question_id] || {})[key]) === point.answer_id) input.checked = true;
        input.addEventListener("change", () => {
          const current = answers[question.question_id] || {};
          current[key] = point.answer_id;
          answers[question.question_id] = current;
        });
        return el("td", {}, [input]);
      }));
      return el("tr", {}, [el("td", { class: "row", html: row.text.html })].concat(cells));
    });
    return el("div", { class: "grid-wrap" }, [el("table", { class: "grid" }, [el("thead", {}, [top, second]), el("tbody", {}, body)])]);
  }

  function textField(question, attrs, multiline) {
    const input = multiline ? el("textarea", attrs) : el("input", attrs);
    input.value = (answers[question.question_id] || {}).value || "";
    input.addEventListener("input", () => { answers[question.question_id] = { value: input.value }; });
    return input;
  }

  function renderQuestion(question) {
    const box = el("section", { class: "q", "data-qid": question.question_id });
    const text = el("div", { class: "qtext", html: question.text.html });
    if (question.is_required) text.appendChild(el("span", { class: "req", text: "*", title: "Required" }));
    box.appendChild(text);
    const kind = question.question_type, selector = question.selector;
    if (kind === "DB") { /* descriptive text only */ }
    else if (kind === "MC") {
      const multiple = selector === "MAVR";
      question.choices.forEach((choice) => box.appendChild(choiceInput(question, choice, multiple ? "checkbox" : "radio", question.question_id)));
    } else if (kind === "Matrix") {
      box.appendChild(matrix(question, question.scale_points, question.choices, question.sub_selector === "MultipleAnswer"));
    } else if (kind === "SBS") {
      box.appendChild(sideBySide(question));
    } else if (kind === "TE" && selector === "FORM") {
      question.choices.forEach((choice) => {
        const id = question.question_id + "_" + choice.choice_id;
        const input = el("input", { type: choice.text_entry_validation === "ValidEmail" ? "email" : "text", id });
        input.value = ((answers[question.question_id] || {}).fields || {})[choice.choice_id] || "";
        input.addEventListener("input", () => {
          const current = answers[question.question_id] || {};
          current.fields = Object.assign({}, current.fields, { [choice.choice_id]: input.value });
          answers[question.question_id] = current;
        });
        box.appendChild(el("div", { class: "form-field" }, [el("label", { for: id, html: choice.text.html }), input]));
      });
    } else if (kind === "TE" && selector === "ESTB") {
      box.appendChild(textField(question, { "aria-label": question.text.plain }, true));
    } else if (kind === "TE") {
      const attrs = { "aria-label": question.text.plain, type: "text" };
      if (question.requires_email_address) attrs.type = "email";
      if (question.number_validation) { attrs.type = "number"; attrs.min = question.number_validation.minimum; attrs.max = question.number_validation.maximum; }
      box.appendChild(textField(question, attrs, false));
    } else if (kind === "Slider") {
      const config = question.slider;
      question.choices.forEach((choice) => {
        const start = (config.start_positions.find((p) => p.choice_id === choice.choice_id) || { position: 0.5 }).position;
        const stored = (answers[question.question_id] || {})[choice.choice_id];
        const value = stored !== undefined ? stored : Math.round(config.minimum + start * (config.maximum - config.minimum));
        const step = config.snaps_to_grid ? (config.maximum - config.minimum) / config.grid_lines : 1;
        const input = el("input", { type: "range", min: config.minimum, max: config.maximum, step, value, "aria-label": choice.text.plain });
        const shown = el("span", { class: "val", text: String(value) });
        input.addEventListener("input", () => {
          shown.textContent = input.value;
          const current = answers[question.question_id] || {};
          current[choice.choice_id] = Number(input.value);
          answers[question.question_id] = current;
        });
        box.appendChild(el("div", { class: "slider" }, [el("div", { html: choice.text.html + " " }, [shown]), input]));
      });
    } else {
      box.appendChild(el("p", { text: "(This question type isn't shown in the preview.)" }));
    }
    box.appendChild(el("div", { class: "err", text: "Please answer this question." }));
    return box;
  }

  function isAnswered(question) {
    const value = answers[question.question_id];
    if (!value) return question.question_type === "Slider";
    if (question.question_type === "MC") return question.selector === "MAVR" ? (value.choices || []).length > 0 : !!value.choice;
    if (question.question_type === "Matrix") return question.choices.every((row) => value[row.choice_id] && (!Array.isArray(value[row.choice_id]) || value[row.choice_id].length));
    if (question.question_type === "SBS") return question.side_by_side_columns.every((column) => !column.is_required || question.choices.every((row) => value[column.column_id + "|" + row.choice_id]));
    if (question.selector === "FORM") return question.choices.every((choice) => ((value.fields || {})[choice.choice_id] || "").trim());
    if (question.question_type === "TE") return (value.value || "").trim().length > 0;
    return true;
  }

  function refreshVisibility() {
    document.querySelectorAll(".q[data-qid]").forEach((box) => {
      const question = pages[current].questions.find((q) => q.question_id === box.dataset.qid);
      box.classList.toggle("hidden", !isVisible(question));
    });
  }

  function show(index) {
    current = index;
    jump.value = String(index);
    const main = document.getElementById("main");
    main.innerHTML = "";
    pages[index].questions.forEach((question) => main.appendChild(renderQuestion(question)));
    refreshVisibility();
    const back = el("button", { class: "secondary", type: "button", text: "Back" });
    back.disabled = history.length === 0;
    back.addEventListener("click", () => show(history.pop()));
    const next = el("button", { type: "button", text: index === pages.length - 1 ? "Submit" : "Next" });
    next.addEventListener("click", advance);
    main.appendChild(el("div", { class: "nav" }, [back, next]));
    document.getElementById("progress").textContent = "Page " + (index + 1) + " of " + pages.length + " · " + pages[index].block;
    document.getElementById("bar").style.width = Math.round(((index + 1) / pages.length) * 100) + "%";
    window.scrollTo(0, 0);
  }

  function advance() {
    const page = pages[current];
    let firstMissing = null;
    page.questions.forEach((question) => {
      const box = document.querySelector('.q[data-qid="' + question.question_id + '"]');
      const missing = question.is_required && isVisible(question) && !isAnswered(question);
      box.classList.toggle("missing", missing);
      if (missing && !firstMissing) firstMissing = box;
    });
    if (firstMissing) { firstMissing.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
    const ended = skipRules.some((rule) => {
      const value = answers[rule.question_id];
      return rule.destination === "ENDOFSURVEY" && value && value.choice === rule.choice_id && page.questions.some((q) => q.question_id === rule.question_id);
    });
    if (ended || current === pages.length - 1) { finish(ended); return; }
    history.push(current);
    show(current + 1);
  }

  function describe(question) {
    const value = answers[question.question_id];
    if (!value) return null;
    const choiceText = (id) => (question.choices.find((c) => c.choice_id === id) || { text: { plain: id } }).text.plain;
    if (question.question_type === "MC") {
      const ids = value.choices || (value.choice ? [value.choice] : []);
      return ids.map((id) => choiceText(id) + (((value.text || {})[id]) ? ": " + value.text[id] : "")).join("; ");
    }
    if (question.question_type === "Matrix") {
      return question.choices.filter((row) => value[row.choice_id]).map((row) => {
        const ids = [].concat(value[row.choice_id]);
        return row.text.plain + " → " + ids.map((id) => (question.scale_points.find((p) => p.answer_id === id) || { text: { plain: id } }).text.plain).join(", ");
      }).join("; ");
    }
    if (question.question_type === "SBS") return Object.keys(value).length + " answers";
    if (question.selector === "FORM") return Object.values(value.fields || {}).join("; ");
    if (question.question_type === "Slider") return Object.values(value).join(", ");
    return value.value || null;
  }

  function finish(endedEarly) {
    const main = document.getElementById("main");
    main.innerHTML = "";
    main.appendChild(el("section", { class: "q" }, [
      el("h2", { text: "Thank you" }),
      el("p", { text: (endedEarly ? "This survey is for students, so it ends here for this answer. " : "") + "In the live survey your responses would be recorded now. In this preview they stay on this page and are discarded when you close it." }),
    ]));
    const list = el("dl", { class: "summary" });
    pages.forEach((page) => page.questions.forEach((question) => {
      const text = describe(question);
      if (text) { list.appendChild(el("dt", { text: question.text.plain.slice(0, 160) })); list.appendChild(el("dd", { text })); }
    }));
    main.appendChild(el("section", { class: "q" }, [el("h2", { text: "Your answers in this preview" }), list]));
    const again = el("button", { type: "button", text: "Start over" });
    again.addEventListener("click", () => { for (const key of Object.keys(answers)) delete answers[key]; history.length = 0; show(0); });
    main.appendChild(el("div", { class: "nav" }, [el("span"), again]));
    document.getElementById("progress").textContent = "Finished";
    document.getElementById("bar").style.width = "100%";
    window.scrollTo(0, 0);
  }

  const fromHash = /page=(\d+)/.exec(location.hash);
  show(fromHash ? Math.min(pages.length, Math.max(1, Number(fromHash[1]))) - 1 : 0);
})();
</script>
</body>
</html>
